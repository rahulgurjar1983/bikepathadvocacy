[project]
name = "bikeplan"
version = "0.1.0"
description = "Data-driven proposals for safe, connected, all-ages bike paths for any region"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
bikeplan = "bikeplan:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "textstat==0.7.13",
]

[tool.pytest.ini_options]
testpaths = ["tests", "gates/tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib -p no:cacheprovider"

[tool.coverage.run]
source = ["src", "gates"]
omit = ["gates/tests/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
